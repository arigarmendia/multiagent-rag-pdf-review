[project]
name = "multiagent-rag-pdf-review"
version = "0.1.0"
description = "Multiagent pipeline with RAG for error detection in academic PDF documents"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "streamlit",
    "pymupdf",
    "pdfplumber",
    "transformers",
    "torch",
    "chromadb",
    "sentence-transformers",
    "ollama",
    "language-tool-python",
    "uvicorn",
    "python-dotenv",
    "python-multipart",
    "pydantic",
    "mlflow>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]